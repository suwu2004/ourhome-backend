name: One-shot aggressive stability optimization

on:
  push:
    branches:
      - agent/aggressive-stability-optimization-20260810
    paths:
      - .github/one-shot-aggressive-stability.py
      - .github/workflows/one-shot-aggressive-stability.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Stage aggressive stability optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aggressive-stability-optimization-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded optimization patch
        run: python .github/one-shot-aggressive-stability.py
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabaseQuotaCircuitPatch.js neonFailoverFetchPatch.js runtimeBootstrap.js tests/supabaseQuotaCircuitPatch.test.js tests/neonFailoverFetchPatch.test.js tests/runtimeBootstrap.test.js tests/runtimeUploadPrivacyGuard.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Reduce quota churn and failover egress"
          git push origin HEAD:agent/aggressive-stability-optimization-20260810
