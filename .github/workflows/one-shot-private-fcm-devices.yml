name: One-shot private FCM devices

on:
  push:
    branches: [agent/native-fcm-push-20260810]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-fcm-push-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply private-device FCM patch once
        run: |
          if grep -q "app.post('/push/native/register'" server.js; then
            echo "Private FCM device patch already applied; verification only."
          else
            python .github/one-shot-private-fcm-devices.py
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified private-device patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js nativePush.js tests/nativePush.test.js tests/nativePushServerIntegration.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Deliver native pushes to registered devices"
          git push origin HEAD:agent/native-fcm-push-20260810
