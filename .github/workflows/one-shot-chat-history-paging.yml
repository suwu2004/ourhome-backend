name: One-shot chat history paging

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/chat-history-paging-20260810'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded chat paging patch once
        run: |
          if grep -q "parseChatHistoryPaging" server.js; then
            echo "Patch already applied; verification only."
          else
            python .github/one-shot-chat-history-paging.py
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js chatHistoryPaging.js tests/chatHistoryPaging.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Add optional chat history paging"
          git push origin HEAD:${{ github.head_ref }}
