name: One-shot native FCM push

on:
  push:
    branches: [agent/native-fcm-push-20260810]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-fcm-push-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply native FCM patch once
        run: |
          if grep -q "nativeConfigured: nativePush.configured" server.js; then
            echo "Native FCM server patch already applied; verification only."
          else
            python .github/one-shot-native-fcm-push.py
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json nativePush.js tests/nativePush.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Add native FCM push delivery"
          git push origin HEAD:agent/native-fcm-push-20260810
