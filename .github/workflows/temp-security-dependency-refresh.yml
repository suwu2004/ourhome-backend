name: Temporary security dependency refresh

on:
  push:
    branches:
      - chore/security-dependency-refresh-2026-11

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh vulnerable dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh patched dependency versions and lockfile
        run: |
          npm install --save-exact multer@2.5.0
          npm update body-parser proxy-addr @xmldom/xmldom qs
      - name: Run backend checks
        run: |
          npm run check
          npm test
      - name: Print remaining audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('Vulnerability totals:', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable, via:item.via?.map(v => typeof v === 'string' ? v : v.title)}));
          }
          NODE
      - name: Commit the verified lockfile update
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'fix: update vulnerable request dependencies'
            git push
          else
            echo 'No package or lockfile changes were produced.'
          fi
