name: One-shot stable chat history cursor v2

on:
  push:
    branches: [agent/chat-history-stable-cursor-v2-20260810]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-history-stable-cursor-v2-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stable cursor server patch once
        run: |
          if grep -q "chatHistoryFetchLimit" server.js; then
            echo "Cursor patch already applied; verification only."
          else
            python .github/one-shot-chat-history-cursor-v2.py
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified server patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js chatHistoryPaging.js tests/chatHistoryPaging.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Use stable chat history cursor"
          git push origin HEAD:agent/chat-history-stable-cursor-v2-20260810
