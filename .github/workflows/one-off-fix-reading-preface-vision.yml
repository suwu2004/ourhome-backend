name: One-off fix reading preface and vision

on:
  push:
    branches:
      - agent/fix-reading-preface-and-vision-20260805

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reading-preface-and-vision-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix imported title prefaces and vision marker parsing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reading_path = Path('readingStore.js')
          reading = reading_path.read_text(encoding='utf-8')
          detect_anchor = '''function headingIndexes(lines, pattern) {
'''
          helpers = '''function normalizeTitleKey(value) {
  return String(value || '')
    .normalize('NFKC')
    .replace(/[《》〈〉「」『』【】()（）\[\]{}\s·•:：,，。.!！?？_\-—]+/g, '')
    .toLowerCase();
}

function isRedundantTitlePreface(preface, fallbackTitle) {
  const lines = String(preface || '').split('\\n').map(line => line.trim()).filter(Boolean);
  if (lines.length !== 1) return false;
  const prefaceKey = normalizeTitleKey(lines[0]);
  const titleKey = normalizeTitleKey(fallbackTitle);
  return Boolean(prefaceKey && titleKey && prefaceKey === titleKey);
}

'''
          if 'function isRedundantTitlePreface' not in reading:
              if detect_anchor not in reading:
                  raise SystemExit('reading helper anchor not found')
              reading = reading.replace(detect_anchor, helpers + detect_anchor, 1)

          old_preface = '''    const preface = lines.slice(0, indexes[0]).join('\\n').trim();
    if (preface) chapters.push({ title: '写在前面', content: preface });'''
          new_preface = '''    const preface = lines.slice(0, indexes[0]).join('\\n').trim();
    if (preface && !isRedundantTitlePreface(preface, fallbackTitle)) {
      chapters.push({ title: '写在前面', content: preface });
    }'''
          if old_preface not in reading:
              raise SystemExit('reading preface anchor not found')
          reading_path.write_text(reading.replace(old_preface, new_preface, 1), encoding='utf-8')

          model_path = Path('modelCompatibility.js')
          model = model_path.read_text(encoding='utf-8')
          old_parser = '''function parseVisionReaderOutput(value) {
  const text = String(value || '').trim().replace(/^```(?:text)?\\s*/i, '').replace(/```$/, '').trim();
  if (/^IMAGE_UNAVAILABLE\\b/i.test(text)) return '';
  const match = text.match(/^IMAGE_OK\\s*\\n+([\\s\\S]+)$/i);
  return match?.[1]?.trim() || '';
}'''
          new_parser = '''function parseVisionReaderOutput(value) {
  const text = String(value || '')
    .trim()
    .replace(/^```(?:text)?\\s*/i, '')
    .replace(/```$/, '')
    .trim();
  const lead = text.slice(0, 240);
  if (/IMAGE[ _-]*UNAVAILABLE\\b/i.test(lead)) return '';

  const marker = text.match(/(?:^|\\n)\\s*(?:[-*]\\s*)?(?:\\*\\*)?IMAGE[ _-]*OK(?:\\*\\*)?\\s*(?:[:：-]\\s*)?(?:\\n|\\s+)([\\s\\S]+)$/i);
  const description = marker?.[1]?.trim() || '';
  if (!description || /^IMAGE[ _-]*(?:OK|UNAVAILABLE)\\b/i.test(description)) return '';
  return description;
}'''
          if old_parser not in model:
              raise SystemExit('vision parser anchor not found')
          model_path.write_text(model.replace(old_parser, new_parser, 1), encoding='utf-8')

          reading_test_path = Path('tests/readingStore.test.js')
          reading_test = reading_test_path.read_text(encoding='utf-8')
          reading_test = reading_test.replace("  assert.equal(parsed.chapter_count, 4);\n  assert.equal(parsed.chapters[0].title, '写在前面');\n  assert.equal(parsed.chapters[1].title, '2026/2/14/  天气晴（天空蓝蓝的）');\n  assert.match(parsed.chapters[1].content, /^2026\\/2\\/14/);\n  assert.match(parsed.chapters[1].content, /陆泽宝宝好/);\n  assert.equal(parsed.chapters[3].title, '2026/3/7 纪念日');",
              "  assert.equal(parsed.chapter_count, 3);\n  assert.equal(parsed.chapters[0].title, '2026/2/14/  天气晴（天空蓝蓝的）');\n  assert.match(parsed.chapters[0].content, /^2026\\/2\\/14/);\n  assert.match(parsed.chapters[0].content, /陆泽宝宝好/);\n  assert.equal(parsed.chapters[2].title, '2026/3/7 纪念日');", 1)
          extra_test = '''

test('真正的前言会继续保留，不会因为修掉书名页而丢失', () => {
  const text = `期待回信\n这是一段真的前言。\n写给未来慢慢读。\n2026/2/14\n第一篇。\n2026/2/15\n第二篇。`;
  const parsed = splitReadingText(text, '期待回信.txt');
  assert.equal(parsed.chapter_count, 3);
  assert.equal(parsed.chapters[0].title, '写在前面');
  assert.match(parsed.chapters[0].content, /真的前言/);
});
'''
          if "真正的前言会继续保留" not in reading_test:
              reading_test += extra_test
          reading_test_path.write_text(reading_test, encoding='utf-8')

          model_test_path = Path('tests/modelCompatibility.test.js')
          model_test = model_test_path.read_text(encoding='utf-8')
          anchor = "  assert.equal(parseVisionReaderOutput('IMAGE_OK\\n一只趴着的小猫。'), '一只趴着的小猫。');\n"
          additions = "  assert.equal(parseVisionReaderOutput('**IMAGE_OK**： 一只趴着的小猫。'), '一只趴着的小猫。');\n  assert.equal(parseVisionReaderOutput('- IMAGE OK\\n画面里有一封信。'), '画面里有一封信。');\n"
          if additions not in model_test:
              if anchor not in model_test:
                  raise SystemExit('vision test anchor not found')
              model_test = model_test.replace(anchor, anchor + additions, 1)
          model_test_path.write_text(model_test, encoding='utf-8')
          PY

      - name: Install and run backend checks
        run: npm ci

      - name: Commit tested fixes
        shell: bash
        run: |
          rm .github/workflows/one-off-fix-reading-preface-vision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readingStore.js modelCompatibility.js tests/readingStore.test.js tests/modelCompatibility.test.js .github/workflows/one-off-fix-reading-preface-vision.yml
          git commit -m "Fix redundant reading prefaces and vision markers"
          git push origin HEAD:agent/fix-reading-preface-and-vision-20260805
