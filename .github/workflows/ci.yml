name: Backend CI

on:
  push:
    branches:
      - main
      - agent/refine-prompts-vision-20260805
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  production-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and check health
        run: |
          # Render may still be finishing the GitHub-triggered deployment.
          curl --fail --silent --show-error \
            --retry 24 --retry-delay 10 --retry-all-errors \
            --max-time 20 \
            https://ourhome-backend.onrender.com/
