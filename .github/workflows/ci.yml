name: Backend CI

on:
  push:
    branches:
      - main
      - agent/refine-prompts-vision-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/reading-annotations-phase2-20260805' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reading-annotations-phase2-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire annotation routes
        run: python3 scripts/applyReadingAnnotations.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run syntax checks
        run: npm run check

      - name: Run full backend tests
        run: npm test

      - name: Commit tested implementation
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Backend CI

          on:
            push:
              branches:
                - main
                - agent/refine-prompts-vision-20260805
            pull_request:
              branches:
                - main

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run check
                - run: npm test
          YAML
          rm scripts/applyReadingAnnotations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readingStore.js readingAnnotations.js package.json tests/readingAnnotations.test.js .github/workflows/ci.yml scripts/applyReadingAnnotations.py
          git commit -m "Add shared reading highlights and notes"
          git push origin HEAD:agent/reading-annotations-phase2-20260805

  test:
    if: github.head_ref != 'agent/reading-annotations-phase2-20260805'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
