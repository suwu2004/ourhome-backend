name: Backend CI

on:
  push:
    branches:
      - agent/fix-thinking-prompts-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/fix-thinking-prompts-20260805' || github.ref_name == 'agent/fix-thinking-prompts-20260805')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-thinking-prompts-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply thinking and prompt patch
        run: python3 .github/scripts/apply-thinking-prompt-fix.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run syntax checks
        run: npm run check
      - name: Run full backend tests
        run: npm test
      - name: Commit tested implementation
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: Backend CI

          on:
            push:
              branches:
                - main
                - agent/refine-prompts-vision-20260805
            pull_request:
              branches:
                - main

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run check
                - run: npm test
          YAML
          rm .github/scripts/apply-thinking-prompt-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/ci.yml .github/scripts/apply-thinking-prompt-fix.py
          git commit -m "Fix visible thinking and regeneration prompts"
          git push origin HEAD:agent/fix-thinking-prompts-20260805
