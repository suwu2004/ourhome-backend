name: One-shot chat legacy cursor bridge

on:
  push:
    branches: [agent/chat-history-legacy-cursor-bridge-20260810]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chat-history-legacy-cursor-bridge-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply legacy cursor bridge once
        run: |
          if grep -q "legacyExclusive" server.js; then
            echo "Legacy cursor bridge already applied; verification only."
          else
            python .github/one-shot-chat-legacy-cursor-bridge.py
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js chatHistoryPaging.js tests/chatHistoryPaging.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Bridge legacy chat history cursors"
          git push origin HEAD:agent/chat-history-legacy-cursor-bridge-20260810
