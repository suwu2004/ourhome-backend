name: One-off reading room wiring

on:
  push:
    branches:
      - agent/reading-room-phase1-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reading-room-phase1-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire reading routes into server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          import_anchor = "} = require('./replyLength');\n"
          import_line = "const { registerReadingRoutes } = require('./readingStore');\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('replyLength import anchor not found exactly once')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          base_anchor = "// ============ 基础 ============\n"
          registration = "registerReadingRoutes(app, { supabase, upload });\n\n"
          if registration not in text:
              if text.count(base_anchor) != 1:
                  raise SystemExit('base route anchor not found exactly once')
              text = text.replace(base_anchor, registration + base_anchor, 1)

          old_version = "version: '2026.08.04-chat-model-routing-v2',"
          new_version = "version: '2026.08.05-reading-room-phase1',"
          if old_version in text:
              text = text.replace(old_version, new_version, 1)
          elif new_version not in text:
              raise SystemExit('backend version anchor not found')

          capability_anchor = "      settingsAssistantAccess: false,\n"
          capabilities = "      sharedReading: true,\n      readingTxtImport: true,\n      readingProgress: true,\n"
          if capabilities not in text:
              if text.count(capability_anchor) != 1:
                  raise SystemExit('capability anchor not found exactly once')
              text = text.replace(capability_anchor, capabilities + capability_anchor, 1)

          backup_anchor = "  { key: 'home_memos', table: 'home_memos', order: ['updated_at', false], limit: 5000 },\n"
          backup_rows = "  { key: 'reading_books', table: 'reading_books', order: ['updated_at', false], limit: 2000 },\n  { key: 'reading_chapters', table: 'reading_chapters', order: ['chapter_index', true], limit: 20000 },\n  { key: 'reading_progress', table: 'reading_progress', order: ['updated_at', false], limit: 5000 },\n"
          if backup_rows not in text:
              if text.count(backup_anchor) != 1:
                  raise SystemExit('backup anchor not found exactly once')
              text = text.replace(backup_anchor, backup_anchor + backup_rows, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install and run full backend checks
        run: npm ci

      - name: Commit tested wiring
        shell: bash
        run: |
          rm .github/workflows/one-off-reading-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js readingStore.js tests/readingStore.test.js package.json .github/workflows/one-off-reading-phase1.yml
          git commit -m "Add shared reading backend foundation"
          git push origin HEAD:agent/reading-room-phase1-20260805
